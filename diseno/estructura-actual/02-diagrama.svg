<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1220" viewBox="0 0 1700 1220"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#638173"/></marker></defs><rect width="1700" height="1220" fill="#fbfcfa"/><text x="40" y="44" font-family="Arial" font-size="29" font-weight="bold" fill="#173c31">02 · Proceso de trabajo</text><text x="40" y="73" font-family="Arial" font-size="16" fill="#60766b">Las flechas indican dependencias y decisiones. Una tarea importada no queda preparada automáticamente.</text><polyline points="405,205.0 455,205.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="820,205.0 870,205.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1235,205.0 1285,205.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1467.5,270 1467.5,390" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="455,455.0 405,455.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="222.5,520 222.5,700" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="405,765.0 455,765.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="820,765.0 870,765.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1285,455.0 1235,455.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="1050" y="375" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">Faltan condiciones</text><polyline points="1052.5,520 1052,555 1467,555 1467.5,520" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="1467" y="543" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">Volver a revisar</text><polyline points="1285,455.0 1260,455 1260,315 637,315 637.5,390" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="830" y="302" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">Condiciones completas</text><polyline points="1235,765.0 1670,765 1670,205 1650,205.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1440" y="748" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">Siguiente ciclo</text><rect x="40" y="140" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="56" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F01 · Cargar las fuentes</text><text x="56" y="198" font-family="Arial" font-size="14" fill="#486455">Cronograma XML / Excel / CSV.</text><text x="56" y="218" font-family="Arial" font-size="14" fill="#486455">Metrados y catálogo de rendimientos.</text><rect x="455" y="140" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="471" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F02 · Revisar la importación</text><text x="471" y="198" font-family="Arial" font-size="14" fill="#486455">Elegir hoja y columnas; validar errores.</text><text x="471" y="218" font-family="Arial" font-size="14" fill="#486455">Conservar fechas y precedencias.</text><rect x="870" y="140" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="886" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F03 · Completar actividad–ubicación</text><text x="886" y="198" font-family="Arial" font-size="14" fill="#486455">Vincular cantidad Q y rendimiento R.</text><text x="886" y="218" font-family="Arial" font-size="14" fill="#486455">Definir ubicación, orden y cuadrilla.</text><rect x="1285" y="140" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="1301" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F04 · Revisar el Lookahead</text><text x="1301" y="198" font-family="Arial" font-size="14" fill="#486455">¿Qué trabajo se aproxima?</text><text x="1301" y="218" font-family="Arial" font-size="14" fill="#486455">¿Qué condiciones faltan?</text><rect x="1285" y="390" width="365" height="130" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="1301" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F05 · ¿Está listo para ejecutar?</text><text x="1301" y="448" font-family="Arial" font-size="14" fill="#486455">Comprobar datos, calendario, secuencia,</text><text x="1301" y="468" font-family="Arial" font-size="14" fill="#486455">entregas previas y restricciones.</text><rect x="870" y="390" width="365" height="130" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="886" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F06 · Gestionar restricciones</text><text x="886" y="448" font-family="Arial" font-size="14" fill="#486455">Problema + responsable + fecha.</text><text x="886" y="468" font-family="Arial" font-size="14" fill="#486455">Evidencia y revisión para liberar.</text><rect x="455" y="390" width="365" height="130" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="471" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F07 · Confirmar preparación</text><text x="471" y="448" font-family="Arial" font-size="14" fill="#486455">Revisión declarada por responsable.</text><text x="471" y="468" font-family="Arial" font-size="14" fill="#486455">Recursos, seguridad, calidad y frente.</text><rect x="40" y="390" width="365" height="130" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F08 · Acordar y congelar la semana</text><text x="56" y="448" font-family="Arial" font-size="14" fill="#486455">Cantidad objetivo y criterio de término.</text><text x="56" y="468" font-family="Arial" font-size="14" fill="#486455">Guardar miembros y condiciones del corte.</text><rect x="40" y="700" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="56" y="729" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F09 · Registrar lo observado</text><text x="56" y="758" font-family="Arial" font-size="14" fill="#486455">Cantidad diaria, fecha, evidencia, entrega.</text><text x="56" y="778" font-family="Arial" font-size="14" fill="#486455">Interrupciones: intervalo y causa.</text><rect x="455" y="700" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="471" y="729" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F10 · Evaluar compromisos</text><text x="471" y="758" font-family="Arial" font-size="14" fill="#486455">Cumplido o no cumplido.</text><text x="471" y="778" font-family="Arial" font-size="14" fill="#486455">Si falla: causa y acción correctiva.</text><rect x="870" y="700" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="886" y="729" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F11 · Aprender y volver a planificar</text><text x="886" y="758" font-family="Arial" font-size="14" fill="#486455">PPC / PRL / continuidad.</text><text x="886" y="778" font-family="Arial" font-size="14" fill="#486455">Revisar causas y próximas decisiones.</text><rect x="40" y="910" width="1620" height="100" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="56" y="939" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">V01 · VISUALIZACIÓN DE APOYO · M08</text><text x="56" y="968" font-family="Arial" font-size="14" fill="#486455">Planos CAD: consultar documentos y partidas.  |  Flujo LBMS: consultar tiempo y ubicación.</text><text x="56" y="988" font-family="Arial" font-size="14" fill="#486455">Las vistas ayudan a revisar; no crean avance ejecutado ni liberan restricciones por sí solas.</text><rect x="40" y="1030" width="1620" height="135" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="1059" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">R01 · Reglas que condicionan el proceso</text><text x="56" y="1088" font-family="Arial" font-size="14" fill="#486455">• Una fecha estimada no libera una restricción: se exige evidencia, fecha real y revisión.</text><text x="56" y="1108" font-family="Arial" font-size="14" fill="#486455">• La duración Q/R requiere unidades compatibles y metrado de la ubicación; un total agregado no define frentes.</text><text x="56" y="1128" font-family="Arial" font-size="14" fill="#486455">• El compromiso exige preparación vigente. La semana se congela antes de iniciar; no se añaden miembros después.</text><text x="56" y="1148" font-family="Arial" font-size="14" fill="#486455">• Los registros respetan el corte y el calendario. La falta de registros no demuestra avance físico igual a cero.</text><text x="40" y="1200" font-family="Arial" font-size="13" fill="#60766b">Pitocuna · Estructura actual d4074f4 · Los códigos permiten solicitar cambios; no representan pantallas nuevas.</text></svg>