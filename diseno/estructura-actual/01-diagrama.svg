<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1220" viewBox="0 0 1700 1220"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#638173"/></marker></defs><rect width="1700" height="1220" fill="#fbfcfa"/><text x="40" y="44" font-family="Arial" font-size="29" font-weight="bold" fill="#173c31">01 · Mapa de pantallas</text><text x="40" y="73" font-family="Arial" font-size="16" fill="#60766b">Estructura existente · Las agrupaciones reproducen el menú actual; no son una propuesta de cambio.</text><polyline points="1435.0,500 1317.5,520" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1435.0,500 1552.5,520" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="100" width="1620" height="75" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="129" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">A00 · PITOCUNA · Aplicación de tesis</text><text x="56" y="158" font-family="Arial" font-size="14" fill="#486455">Propuesta preliminar, sujeta a modificaciones y validación.</text><rect x="40" y="195" width="1620" height="105" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="224" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">S00 · Selector superior · siempre visible</text><text x="56" y="253" font-family="Arial" font-size="14" fill="#486455">Mis datos: proyecto guardado.  |  Prueba vacía: sin registros.  |  Valores predeterminados: ejemplo ficticio.</text><text x="56" y="273" font-family="Arial" font-size="14" fill="#486455">La opción activa y los contadores se muestran arriba. Mis datos y prueba se guardan por separado.</text><rect x="40" y="330" width="330" height="50" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="56" y="359" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">RESUMEN</text><rect x="40" y="400" width="330" height="155" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="429" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M01 · Resumen del proyecto</text><text x="56" y="458" font-family="Arial" font-size="14" fill="#486455">Pendientes y estado general.</text><text x="56" y="478" font-family="Arial" font-size="14" fill="#486455">Acceso a actividades y componentes.</text><text x="56" y="498" font-family="Arial" font-size="14" fill="#486455">Revisar ubicación y calendario.</text><rect x="400" y="330" width="780" height="50" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="416" y="359" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">MENÚ · PREPARAR Y EJECUTAR</text><rect x="400" y="400" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="416" y="429" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M02 · Actividades</text><text x="416" y="458" font-family="Arial" font-size="14" fill="#486455">Buscar y filtrar por componente.</text><text x="416" y="478" font-family="Arial" font-size="14" fill="#486455">Ficha: cronograma + Q/R + APU,</text><text x="416" y="498" font-family="Arial" font-size="14" fill="#486455">planos, restricciones y compromisos.</text><rect x="800" y="400" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="816" y="429" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M03 · Lookahead</text><text x="816" y="458" font-family="Arial" font-size="14" fill="#486455">Ventana de 3, 4, 6 u 8 semanas.</text><text x="816" y="478" font-family="Arial" font-size="14" fill="#486455">Revisar condiciones y restricciones.</text><text x="816" y="498" font-family="Arial" font-size="14" fill="#486455">Confirmar preparación cuando procede.</text><rect x="400" y="590" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="416" y="619" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M04 · Restricciones</text><text x="416" y="648" font-family="Arial" font-size="14" fill="#486455">Problema, responsable y fecha necesaria.</text><text x="416" y="668" font-family="Arial" font-size="14" fill="#486455">Abierta / en revisión / liberada.</text><text x="416" y="688" font-family="Arial" font-size="14" fill="#486455">Evidencia y revisión para liberar.</text><rect x="800" y="590" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="816" y="619" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M05 · Plan semanal</text><text x="816" y="648" font-family="Arial" font-size="14" fill="#486455">Actividad preparada + cantidad + criterio.</text><text x="816" y="668" font-family="Arial" font-size="14" fill="#486455">Borrador → congelar → evaluar.</text><text x="816" y="688" font-family="Arial" font-size="14" fill="#486455">Conserva los compromisos del corte.</text><rect x="400" y="780" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="416" y="809" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M06 · Registro de avance</text><text x="416" y="838" font-family="Arial" font-size="14" fill="#486455">Cantidades diarias y evidencia.</text><text x="416" y="858" font-family="Arial" font-size="14" fill="#486455">Confirmación de entrega completa.</text><text x="416" y="878" font-family="Arial" font-size="14" fill="#486455">Interrupciones con fechas y causa.</text><rect x="800" y="780" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="816" y="809" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M07 · Indicadores</text><text x="816" y="838" font-family="Arial" font-size="14" fill="#486455">PPC, PRL y continuidad.</text><text x="816" y="858" font-family="Arial" font-size="14" fill="#486455">Reporte CSV, fórmulas e historial.</text><text x="816" y="878" font-family="Arial" font-size="14" fill="#486455">Resultados a partir de registros.</text><rect x="1210" y="330" width="450" height="50" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="1226" y="359" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">MENÚ · EXPEDIENTE Y CONFIGURACIÓN</text><rect x="1210" y="400" width="450" height="100" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="1226" y="429" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M08 · Visualización de obra</text><text x="1226" y="458" font-family="Arial" font-size="14" fill="#486455">Un mismo espacio para consultar</text><text x="1226" y="478" font-family="Arial" font-size="14" fill="#486455">planos y flujo por componente.</text><rect x="1210" y="520" width="215" height="160" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="1226" y="549" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M08A · Planos CAD</text><text x="1226" y="578" font-family="Arial" font-size="14" fill="#486455">Visor, zoom y marcas</text><text x="1226" y="598" font-family="Arial" font-size="14" fill="#486455">documentales.</text><text x="1226" y="618" font-family="Arial" font-size="14" fill="#486455">Partidas, APU y descarga</text><text x="1226" y="638" font-family="Arial" font-size="14" fill="#486455">DWG.</text><rect x="1445" y="520" width="215" height="160" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="1461" y="549" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M08B · Flujo LBMS</text><text x="1461" y="578" font-family="Arial" font-size="14" fill="#486455">Gráfico tiempo–ubicación.</text><text x="1461" y="598" font-family="Arial" font-size="14" fill="#486455">Plan y pronóstico; puntos</text><text x="1461" y="618" font-family="Arial" font-size="14" fill="#486455">observados cuando</text><text x="1461" y="638" font-family="Arial" font-size="14" fill="#486455">existen.</text><rect x="1210" y="700" width="450" height="95" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1226" y="729" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09 · Datos de obra</text><text x="1226" y="758" font-family="Arial" font-size="14" fill="#486455">4 pestañas de importación y configuración.</text><text x="1226" y="778" font-family="Arial" font-size="14" fill="#486455">Respaldo JSON y nuevo proyecto.</text><rect x="1210" y="815" width="215" height="100" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1226" y="844" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09A · Cronograma</text><text x="1226" y="873" font-family="Arial" font-size="14" fill="#486455">Excel / CSV / Project</text><text x="1226" y="893" font-family="Arial" font-size="14" fill="#486455">XML.</text><rect x="1445" y="815" width="215" height="100" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1461" y="844" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09B · Metrados y R</text><text x="1461" y="873" font-family="Arial" font-size="14" fill="#486455">Cantidad, unidad y</text><text x="1461" y="893" font-family="Arial" font-size="14" fill="#486455">rendimiento.</text><rect x="1210" y="925" width="215" height="100" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1226" y="954" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09C · Ubicaciones LBS</text><text x="1226" y="983" font-family="Arial" font-size="14" fill="#486455">Ubicación, grupo y orden.</text><rect x="1445" y="925" width="215" height="100" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1461" y="954" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09D ·</text><text x="1461" y="976" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">Proyecto/calendario</text><text x="1461" y="1005" font-family="Arial" font-size="14" fill="#486455">Jornadas y feriados.</text><rect x="40" y="600" width="330" height="185" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="629" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">C00 · Controles compartidos</text><text x="56" y="658" font-family="Arial" font-size="14" fill="#486455">Fecha de corte: limita la observación.</text><text x="56" y="678" font-family="Arial" font-size="14" fill="#486455">Componente: se conserva entre vistas.</text><text x="56" y="698" font-family="Arial" font-size="14" fill="#486455">Plan semanal e indicadores evalúan</text><text x="56" y="718" font-family="Arial" font-size="14" fill="#486455">el corte completo, sin filtrar miembros.</text><rect x="40" y="820" width="330" height="165" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="56" y="849" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">C01 · Cómo pedir un cambio</text><text x="56" y="878" font-family="Arial" font-size="14" fill="#486455">Usa el código del bloque.</text><text x="56" y="898" font-family="Arial" font-size="14" fill="#486455">Ejemplo: «Mover M09C bajo M08».</text><text x="56" y="918" font-family="Arial" font-size="14" fill="#486455">Ese cambio aún NO está aplicado.</text><rect x="40" y="1040" width="1620" height="95" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="1069" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">L00 · LBS ≠ LBMS</text><text x="56" y="1098" font-family="Arial" font-size="14" fill="#486455">LBS organiza los lugares de trabajo. LBMS utiliza esas ubicaciones, cantidades y tiempos para representar el flujo. Los planos CAD son otra vista del expediente.</text><text x="40" y="1200" font-family="Arial" font-size="13" fill="#60766b">Pitocuna · Estructura actual d4074f4 · Los códigos permiten solicitar cambios; no representan pantallas nuevas.</text></svg>