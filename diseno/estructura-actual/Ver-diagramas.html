<!doctype html><html lang="es"><meta charset="utf-8"><title>Estructura actual de Pitocuna</title><style>@page{size:A3 landscape;margin:8mm}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#edf2ec}.sheet{page-break-after:always;background:white;margin:15px auto;max-width:1700px}.sheet:last-child{page-break-after:auto}svg{width:100%;height:auto;display:block}@media print{body{background:white}.sheet{margin:0;width:100%;max-width:none;height:280mm;break-inside:avoid}svg{width:100%;height:100%;object-fit:contain}}</style><section class="sheet"><svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1220" viewBox="0 0 1700 1220"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#638173"/></marker></defs><rect width="1700" height="1220" fill="#fbfcfa"/><text x="40" y="44" font-family="Arial" font-size="29" font-weight="bold" fill="#173c31">01 · Mapa de pantallas</text><text x="40" y="73" font-family="Arial" font-size="16" fill="#60766b">Estructura existente · Las agrupaciones reproducen el menú actual; no son una propuesta de cambio.</text><polyline points="1435.0,500 1317.5,520" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1435.0,500 1552.5,520" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="100" width="1620" height="75" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="129" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">A00 · PITOCUNA · Aplicación de tesis</text><text x="56" y="158" font-family="Arial" font-size="14" fill="#486455">Propuesta preliminar, sujeta a modificaciones y validación.</text><rect x="40" y="195" width="1620" height="105" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="224" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">S00 · Selector superior · siempre visible</text><text x="56" y="253" font-family="Arial" font-size="14" fill="#486455">Mis datos: proyecto guardado.  |  Prueba vacía: sin registros.  |  Valores predeterminados: ejemplo ficticio.</text><text x="56" y="273" font-family="Arial" font-size="14" fill="#486455">La opción activa y los contadores se muestran arriba. Mis datos y prueba se guardan por separado.</text><rect x="40" y="330" width="330" height="50" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="56" y="359" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">RESUMEN</text><rect x="40" y="400" width="330" height="155" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="429" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M01 · Resumen del proyecto</text><text x="56" y="458" font-family="Arial" font-size="14" fill="#486455">Pendientes y estado general.</text><text x="56" y="478" font-family="Arial" font-size="14" fill="#486455">Acceso a actividades y componentes.</text><text x="56" y="498" font-family="Arial" font-size="14" fill="#486455">Revisar ubicación y calendario.</text><rect x="400" y="330" width="780" height="50" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="416" y="359" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">MENÚ · PREPARAR Y EJECUTAR</text><rect x="400" y="400" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="416" y="429" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M02 · Actividades</text><text x="416" y="458" font-family="Arial" font-size="14" fill="#486455">Buscar y filtrar por componente.</text><text x="416" y="478" font-family="Arial" font-size="14" fill="#486455">Ficha: cronograma + Q/R + APU,</text><text x="416" y="498" font-family="Arial" font-size="14" fill="#486455">planos, restricciones y compromisos.</text><rect x="800" y="400" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="816" y="429" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M03 · Lookahead</text><text x="816" y="458" font-family="Arial" font-size="14" fill="#486455">Ventana de 3, 4, 6 u 8 semanas.</text><text x="816" y="478" font-family="Arial" font-size="14" fill="#486455">Revisar condiciones y restricciones.</text><text x="816" y="498" font-family="Arial" font-size="14" fill="#486455">Confirmar preparación cuando procede.</text><rect x="400" y="590" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="416" y="619" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M04 · Restricciones</text><text x="416" y="648" font-family="Arial" font-size="14" fill="#486455">Problema, responsable y fecha necesaria.</text><text x="416" y="668" font-family="Arial" font-size="14" fill="#486455">Abierta / en revisión / liberada.</text><text x="416" y="688" font-family="Arial" font-size="14" fill="#486455">Evidencia y revisión para liberar.</text><rect x="800" y="590" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="816" y="619" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M05 · Plan semanal</text><text x="816" y="648" font-family="Arial" font-size="14" fill="#486455">Actividad preparada + cantidad + criterio.</text><text x="816" y="668" font-family="Arial" font-size="14" fill="#486455">Borrador → congelar → evaluar.</text><text x="816" y="688" font-family="Arial" font-size="14" fill="#486455">Conserva los compromisos del corte.</text><rect x="400" y="780" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="416" y="809" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M06 · Registro de avance</text><text x="416" y="838" font-family="Arial" font-size="14" fill="#486455">Cantidades diarias y evidencia.</text><text x="416" y="858" font-family="Arial" font-size="14" fill="#486455">Confirmación de entrega completa.</text><text x="416" y="878" font-family="Arial" font-size="14" fill="#486455">Interrupciones con fechas y causa.</text><rect x="800" y="780" width="380" height="160" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="816" y="809" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M07 · Indicadores</text><text x="816" y="838" font-family="Arial" font-size="14" fill="#486455">PPC, PRL y continuidad.</text><text x="816" y="858" font-family="Arial" font-size="14" fill="#486455">Reporte CSV, fórmulas e historial.</text><text x="816" y="878" font-family="Arial" font-size="14" fill="#486455">Resultados a partir de registros.</text><rect x="1210" y="330" width="450" height="50" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="1226" y="359" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">MENÚ · EXPEDIENTE Y CONFIGURACIÓN</text><rect x="1210" y="400" width="450" height="100" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="1226" y="429" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M08 · Visualización de obra</text><text x="1226" y="458" font-family="Arial" font-size="14" fill="#486455">Un mismo espacio para consultar</text><text x="1226" y="478" font-family="Arial" font-size="14" fill="#486455">planos y flujo por componente.</text><rect x="1210" y="520" width="215" height="160" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="1226" y="549" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M08A · Planos CAD</text><text x="1226" y="578" font-family="Arial" font-size="14" fill="#486455">Visor, zoom y marcas</text><text x="1226" y="598" font-family="Arial" font-size="14" fill="#486455">documentales.</text><text x="1226" y="618" font-family="Arial" font-size="14" fill="#486455">Partidas, APU y descarga</text><text x="1226" y="638" font-family="Arial" font-size="14" fill="#486455">DWG.</text><rect x="1445" y="520" width="215" height="160" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="1461" y="549" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M08B · Flujo LBMS</text><text x="1461" y="578" font-family="Arial" font-size="14" fill="#486455">Gráfico tiempo–ubicación.</text><text x="1461" y="598" font-family="Arial" font-size="14" fill="#486455">Plan y pronóstico; puntos</text><text x="1461" y="618" font-family="Arial" font-size="14" fill="#486455">observados cuando</text><text x="1461" y="638" font-family="Arial" font-size="14" fill="#486455">existen.</text><rect x="1210" y="700" width="450" height="95" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1226" y="729" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09 · Datos de obra</text><text x="1226" y="758" font-family="Arial" font-size="14" fill="#486455">4 pestañas de importación y configuración.</text><text x="1226" y="778" font-family="Arial" font-size="14" fill="#486455">Respaldo JSON y nuevo proyecto.</text><rect x="1210" y="815" width="215" height="100" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1226" y="844" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09A · Cronograma</text><text x="1226" y="873" font-family="Arial" font-size="14" fill="#486455">Excel / CSV / Project</text><text x="1226" y="893" font-family="Arial" font-size="14" fill="#486455">XML.</text><rect x="1445" y="815" width="215" height="100" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1461" y="844" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09B · Metrados y R</text><text x="1461" y="873" font-family="Arial" font-size="14" fill="#486455">Cantidad, unidad y</text><text x="1461" y="893" font-family="Arial" font-size="14" fill="#486455">rendimiento.</text><rect x="1210" y="925" width="215" height="100" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1226" y="954" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09C · Ubicaciones LBS</text><text x="1226" y="983" font-family="Arial" font-size="14" fill="#486455">Ubicación, grupo y orden.</text><rect x="1445" y="925" width="215" height="100" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="1461" y="954" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">M09D ·</text><text x="1461" y="976" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">Proyecto/calendario</text><text x="1461" y="1005" font-family="Arial" font-size="14" fill="#486455">Jornadas y feriados.</text><rect x="40" y="600" width="330" height="185" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="629" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">C00 · Controles compartidos</text><text x="56" y="658" font-family="Arial" font-size="14" fill="#486455">Fecha de corte: limita la observación.</text><text x="56" y="678" font-family="Arial" font-size="14" fill="#486455">Componente: se conserva entre vistas.</text><text x="56" y="698" font-family="Arial" font-size="14" fill="#486455">Plan semanal e indicadores evalúan</text><text x="56" y="718" font-family="Arial" font-size="14" fill="#486455">el corte completo, sin filtrar miembros.</text><rect x="40" y="820" width="330" height="165" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="56" y="849" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">C01 · Cómo pedir un cambio</text><text x="56" y="878" font-family="Arial" font-size="14" fill="#486455">Usa el código del bloque.</text><text x="56" y="898" font-family="Arial" font-size="14" fill="#486455">Ejemplo: «Mover M09C bajo M08».</text><text x="56" y="918" font-family="Arial" font-size="14" fill="#486455">Ese cambio aún NO está aplicado.</text><rect x="40" y="1040" width="1620" height="95" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="1069" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">L00 · LBS ≠ LBMS</text><text x="56" y="1098" font-family="Arial" font-size="14" fill="#486455">LBS organiza los lugares de trabajo. LBMS utiliza esas ubicaciones, cantidades y tiempos para representar el flujo. Los planos CAD son otra vista del expediente.</text><text x="40" y="1200" font-family="Arial" font-size="13" fill="#60766b">Pitocuna · Estructura actual d4074f4 · Los códigos permiten solicitar cambios; no representan pantallas nuevas.</text></svg></section><section class="sheet"><svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1220" viewBox="0 0 1700 1220"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#638173"/></marker></defs><rect width="1700" height="1220" fill="#fbfcfa"/><text x="40" y="44" font-family="Arial" font-size="29" font-weight="bold" fill="#173c31">02 · Proceso de trabajo</text><text x="40" y="73" font-family="Arial" font-size="16" fill="#60766b">Las flechas indican dependencias y decisiones. Una tarea importada no queda preparada automáticamente.</text><polyline points="405,205.0 455,205.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="820,205.0 870,205.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1235,205.0 1285,205.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1467.5,270 1467.5,390" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="455,455.0 405,455.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="222.5,520 222.5,700" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="405,765.0 455,765.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="820,765.0 870,765.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1285,455.0 1235,455.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="1050" y="375" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">Faltan condiciones</text><polyline points="1052.5,520 1052,555 1467,555 1467.5,520" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="1467" y="543" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">Volver a revisar</text><polyline points="1285,455.0 1260,455 1260,315 637,315 637.5,390" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="830" y="302" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">Condiciones completas</text><polyline points="1235,765.0 1670,765 1670,205 1650,205.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1440" y="748" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">Siguiente ciclo</text><rect x="40" y="140" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="56" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F01 · Cargar las fuentes</text><text x="56" y="198" font-family="Arial" font-size="14" fill="#486455">Cronograma XML / Excel / CSV.</text><text x="56" y="218" font-family="Arial" font-size="14" fill="#486455">Metrados y catálogo de rendimientos.</text><rect x="455" y="140" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="471" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F02 · Revisar la importación</text><text x="471" y="198" font-family="Arial" font-size="14" fill="#486455">Elegir hoja y columnas; validar errores.</text><text x="471" y="218" font-family="Arial" font-size="14" fill="#486455">Conservar fechas y precedencias.</text><rect x="870" y="140" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="886" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F03 · Completar actividad–ubicación</text><text x="886" y="198" font-family="Arial" font-size="14" fill="#486455">Vincular cantidad Q y rendimiento R.</text><text x="886" y="218" font-family="Arial" font-size="14" fill="#486455">Definir ubicación, orden y cuadrilla.</text><rect x="1285" y="140" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="1301" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F04 · Revisar el Lookahead</text><text x="1301" y="198" font-family="Arial" font-size="14" fill="#486455">¿Qué trabajo se aproxima?</text><text x="1301" y="218" font-family="Arial" font-size="14" fill="#486455">¿Qué condiciones faltan?</text><rect x="1285" y="390" width="365" height="130" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="1301" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F05 · ¿Está listo para ejecutar?</text><text x="1301" y="448" font-family="Arial" font-size="14" fill="#486455">Comprobar datos, calendario, secuencia,</text><text x="1301" y="468" font-family="Arial" font-size="14" fill="#486455">entregas previas y restricciones.</text><rect x="870" y="390" width="365" height="130" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="886" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F06 · Gestionar restricciones</text><text x="886" y="448" font-family="Arial" font-size="14" fill="#486455">Problema + responsable + fecha.</text><text x="886" y="468" font-family="Arial" font-size="14" fill="#486455">Evidencia y revisión para liberar.</text><rect x="455" y="390" width="365" height="130" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="471" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F07 · Confirmar preparación</text><text x="471" y="448" font-family="Arial" font-size="14" fill="#486455">Revisión declarada por responsable.</text><text x="471" y="468" font-family="Arial" font-size="14" fill="#486455">Recursos, seguridad, calidad y frente.</text><rect x="40" y="390" width="365" height="130" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F08 · Acordar y congelar la semana</text><text x="56" y="448" font-family="Arial" font-size="14" fill="#486455">Cantidad objetivo y criterio de término.</text><text x="56" y="468" font-family="Arial" font-size="14" fill="#486455">Guardar miembros y condiciones del corte.</text><rect x="40" y="700" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="56" y="729" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F09 · Registrar lo observado</text><text x="56" y="758" font-family="Arial" font-size="14" fill="#486455">Cantidad diaria, fecha, evidencia, entrega.</text><text x="56" y="778" font-family="Arial" font-size="14" fill="#486455">Interrupciones: intervalo y causa.</text><rect x="455" y="700" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="471" y="729" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F10 · Evaluar compromisos</text><text x="471" y="758" font-family="Arial" font-size="14" fill="#486455">Cumplido o no cumplido.</text><text x="471" y="778" font-family="Arial" font-size="14" fill="#486455">Si falla: causa y acción correctiva.</text><rect x="870" y="700" width="365" height="130" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="886" y="729" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">F11 · Aprender y volver a planificar</text><text x="886" y="758" font-family="Arial" font-size="14" fill="#486455">PPC / PRL / continuidad.</text><text x="886" y="778" font-family="Arial" font-size="14" fill="#486455">Revisar causas y próximas decisiones.</text><rect x="40" y="910" width="1620" height="100" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="56" y="939" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">V01 · VISUALIZACIÓN DE APOYO · M08</text><text x="56" y="968" font-family="Arial" font-size="14" fill="#486455">Planos CAD: consultar documentos y partidas.  |  Flujo LBMS: consultar tiempo y ubicación.</text><text x="56" y="988" font-family="Arial" font-size="14" fill="#486455">Las vistas ayudan a revisar; no crean avance ejecutado ni liberan restricciones por sí solas.</text><rect x="40" y="1030" width="1620" height="135" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="1059" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">R01 · Reglas que condicionan el proceso</text><text x="56" y="1088" font-family="Arial" font-size="14" fill="#486455">• Una fecha estimada no libera una restricción: se exige evidencia, fecha real y revisión.</text><text x="56" y="1108" font-family="Arial" font-size="14" fill="#486455">• La duración Q/R requiere unidades compatibles y metrado de la ubicación; un total agregado no define frentes.</text><text x="56" y="1128" font-family="Arial" font-size="14" fill="#486455">• El compromiso exige preparación vigente. La semana se congela antes de iniciar; no se añaden miembros después.</text><text x="56" y="1148" font-family="Arial" font-size="14" fill="#486455">• Los registros respetan el corte y el calendario. La falta de registros no demuestra avance físico igual a cero.</text><text x="40" y="1200" font-family="Arial" font-size="13" fill="#60766b">Pitocuna · Estructura actual d4074f4 · Los códigos permiten solicitar cambios; no representan pantallas nuevas.</text></svg></section><section class="sheet"><svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1220" viewBox="0 0 1700 1220"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#638173"/></marker></defs><rect width="1700" height="1220" fill="#fbfcfa"/><text x="40" y="44" font-family="Arial" font-size="29" font-weight="bold" fill="#173c31">03 · Datos y cálculos</text><text x="40" y="73" font-family="Arial" font-size="16" fill="#60766b">Arquitectura actual · Aplicación estática en navegador, con guardado local y respaldo exportable.</text><polyline points="500,222.5 620,222.5" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="850.0,305 850.0,390" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1080,222.5 1200,235.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1430.0,330 1430.0,390" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="620,492.5 500,492.5" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="480.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">calcular</text><polyline points="1080,492.5 1200,492.5" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="1140.0" y="480.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">mostrar</text><polyline points="270.0,595 270,620 1430,620 1430.0,595" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="1170" y="640" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">resultados calculados</text><polyline points="850.0,595 850,655 270,655 270.0,740" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="643" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">guardar / recuperar</text><polyline points="850.0,595 850.0,740" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="850.0" y="655.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">solo en modo prueba</text><rect x="40" y="140" width="460" height="165" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T01 · Entradas</text><text x="56" y="198" font-family="Arial" font-size="14" fill="#486455">Cronograma XML / Excel / CSV.</text><text x="56" y="218" font-family="Arial" font-size="14" fill="#486455">Metrados Excel / CSV; catálogo APU CSV.</text><text x="56" y="238" font-family="Arial" font-size="14" fill="#486455">Expediente publicado: PDFs y vistas CAD.</text><text x="56" y="258" font-family="Arial" font-size="14" fill="#486455">MPP y DWG no se interpretan directamente en el navegador.</text><rect x="620" y="140" width="460" height="165" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="636" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T02 · Interfaz y validación</text><text x="636" y="198" font-family="Arial" font-size="14" fill="#486455">app.js + importers.js</text><text x="636" y="218" font-family="Arial" font-size="14" fill="#486455">Formularios, importación, fecha de corte.</text><text x="636" y="238" font-family="Arial" font-size="14" fill="#486455">workspace-ui.js: resumen y fichas.</text><text x="636" y="258" font-family="Arial" font-size="14" fill="#486455">Selecciona el proyecto real o la prueba.</text><rect x="620" y="390" width="460" height="205" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="636" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T03 · Modelo del proyecto</text><text x="636" y="448" font-family="Arial" font-size="14" fill="#486455">Actividades y cantidades por ubicación.</text><text x="636" y="468" font-family="Arial" font-size="14" fill="#486455">Restricciones y vínculos a actividades.</text><text x="636" y="488" font-family="Arial" font-size="14" fill="#486455">Planes, avances e interrupciones.</text><text x="636" y="508" font-family="Arial" font-size="14" fill="#486455">Componentes, fuentes, planos y marcas.</text><text x="636" y="528" font-family="Arial" font-size="14" fill="#486455">Correspondencias e historial.</text><rect x="40" y="390" width="460" height="205" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="56" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T04 · Motor operativo · engine.js</text><text x="56" y="448" font-family="Arial" font-size="14" fill="#486455">Calendario y duración Q/R.</text><text x="56" y="468" font-family="Arial" font-size="14" fill="#486455">Precedencias, entregas y cuadrillas.</text><text x="56" y="488" font-family="Arial" font-size="14" fill="#486455">Preparación y pronóstico condicionado.</text><text x="56" y="508" font-family="Arial" font-size="14" fill="#486455">Compromisos, PPC, PRL y continuidad.</text><rect x="1200" y="140" width="460" height="190" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="1216" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T05 · Relación documental</text><text x="1216" y="198" font-family="Arial" font-size="14" fill="#486455">relations.js + documents.js</text><text x="1216" y="218" font-family="Arial" font-size="14" fill="#486455">Cruces de WBS, descripción y componente.</text><text x="1216" y="238" font-family="Arial" font-size="14" fill="#486455">Referencias a metrado, APU y plano.</text><text x="1216" y="258" font-family="Arial" font-size="14" fill="#486455">No reparte totales ni inventa ubicaciones.</text><text x="1216" y="278" font-family="Arial" font-size="14" fill="#486455">Un enlace documental no habilita ejecución.</text><rect x="1200" y="390" width="460" height="205" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="1216" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T06 · Salidas y visores</text><text x="1216" y="448" font-family="Arial" font-size="14" fill="#486455">Resumen, Lookahead y restricciones.</text><text x="1216" y="468" font-family="Arial" font-size="14" fill="#486455">Plan semanal y registro de avance.</text><text x="1216" y="488" font-family="Arial" font-size="14" fill="#486455">Indicadores, historial y exportaciones.</text><text x="1216" y="508" font-family="Arial" font-size="14" fill="#486455">plans-ui.js: visor CAD.</text><text x="1216" y="528" font-family="Arial" font-size="14" fill="#486455">Flujo LBMS: gráfico de tiempo–ubicación.</text><rect x="40" y="740" width="460" height="175" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="769" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T07 · Mis datos · almacenamiento local</text><text x="56" y="798" font-family="Arial" font-size="14" fill="#486455">Proyecto guardado en este navegador.</text><text x="56" y="818" font-family="Arial" font-size="14" fill="#486455">Versión anterior para recuperación.</text><text x="56" y="838" font-family="Arial" font-size="14" fill="#486455">Exportar / restaurar respaldo JSON.</text><text x="56" y="858" font-family="Arial" font-size="14" fill="#486455">Sin sincronización entre dispositivos.</text><rect x="620" y="740" width="460" height="195" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="636" y="769" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T08 · Prueba · almacenamiento separado</text><text x="636" y="798" font-family="Arial" font-size="14" fill="#486455">Prueba vacía: inicia sin registros.</text><text x="636" y="818" font-family="Arial" font-size="14" fill="#486455">Predeterminados: 8 actividades, 4 restricciones</text><text x="636" y="838" font-family="Arial" font-size="14" fill="#486455">y un plan con 2 compromisos ficticios.</text><text x="636" y="858" font-family="Arial" font-size="14" fill="#486455">Ambas opciones usan un espacio de prueba.</text><text x="636" y="878" font-family="Arial" font-size="14" fill="#486455">Mis datos recupera el proyecto anterior.</text><rect x="1200" y="740" width="460" height="195" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="1216" y="769" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T09 · Alcance de la seguridad actual</text><text x="1216" y="798" font-family="Arial" font-size="14" fill="#486455">Se verifica la estructura de los registros.</text><text x="1216" y="818" font-family="Arial" font-size="14" fill="#486455">La prueba no escribe sobre el proyecto real.</text><text x="1216" y="838" font-family="Arial" font-size="14" fill="#486455">No hay cuentas, roles autenticados ni servidor</text><text x="1216" y="858" font-family="Arial" font-size="14" fill="#486455">de evidencias; el revisor es declarado.</text><text x="1216" y="878" font-family="Arial" font-size="14" fill="#486455">Borrar datos del navegador puede perder registros.</text><rect x="40" y="1000" width="1620" height="140" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="1029" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T10 · Qué significa «conectado»</text><text x="56" y="1058" font-family="Arial" font-size="14" fill="#486455">Conexión operativa: misma partida + ubicación → puede alimentar Q/R y preparación si cumple las demás reglas.</text><text x="56" y="1078" font-family="Arial" font-size="14" fill="#486455">Conexión documental: correspondencia de fuentes → sirve para consultar y revisar, aunque la ejecución siga pendiente.</text><text x="56" y="1098" font-family="Arial" font-size="14" fill="#486455">LBS y cuadrillas reales deben definirse y validarse; los documentos agregados no sustituyen esos datos.</text><text x="40" y="1200" font-family="Arial" font-size="13" fill="#60766b">Pitocuna · Estructura actual d4074f4 · Los códigos permiten solicitar cambios; no representan pantallas nuevas.</text></svg></section>
