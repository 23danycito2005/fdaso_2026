<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1220" viewBox="0 0 1700 1220"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#638173"/></marker></defs><rect width="1700" height="1220" fill="#fbfcfa"/><text x="40" y="44" font-family="Arial" font-size="29" font-weight="bold" fill="#173c31">03 · Datos y cálculos</text><text x="40" y="73" font-family="Arial" font-size="16" fill="#60766b">Arquitectura actual · Aplicación estática en navegador, con guardado local y respaldo exportable.</text><polyline points="500,222.5 620,222.5" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="850.0,305 850.0,390" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1080,222.5 1200,235.0" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1430.0,330 1430.0,390" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><polyline points="620,492.5 500,492.5" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="480.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">calcular</text><polyline points="1080,492.5 1200,492.5" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="1140.0" y="480.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">mostrar</text><polyline points="270.0,595 270,620 1430,620 1430.0,595" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="1170" y="640" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">resultados calculados</text><polyline points="850.0,595 850,655 270,655 270.0,740" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="643" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">guardar / recuperar</text><polyline points="850.0,595 850.0,740" fill="none" stroke="#638173" stroke-width="2" marker-end="url(#arrow)"/><text x="850.0" y="655.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#375a49" stroke="#fbfcfa" stroke-width="5" paint-order="stroke">solo en modo prueba</text><rect x="40" y="140" width="460" height="165" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T01 · Entradas</text><text x="56" y="198" font-family="Arial" font-size="14" fill="#486455">Cronograma XML / Excel / CSV.</text><text x="56" y="218" font-family="Arial" font-size="14" fill="#486455">Metrados Excel / CSV; catálogo APU CSV.</text><text x="56" y="238" font-family="Arial" font-size="14" fill="#486455">Expediente publicado: PDFs y vistas CAD.</text><text x="56" y="258" font-family="Arial" font-size="14" fill="#486455">MPP y DWG no se interpretan directamente en el navegador.</text><rect x="620" y="140" width="460" height="165" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="636" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T02 · Interfaz y validación</text><text x="636" y="198" font-family="Arial" font-size="14" fill="#486455">app.js + importers.js</text><text x="636" y="218" font-family="Arial" font-size="14" fill="#486455">Formularios, importación, fecha de corte.</text><text x="636" y="238" font-family="Arial" font-size="14" fill="#486455">workspace-ui.js: resumen y fichas.</text><text x="636" y="258" font-family="Arial" font-size="14" fill="#486455">Selecciona el proyecto real o la prueba.</text><rect x="620" y="390" width="460" height="205" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="636" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T03 · Modelo del proyecto</text><text x="636" y="448" font-family="Arial" font-size="14" fill="#486455">Actividades y cantidades por ubicación.</text><text x="636" y="468" font-family="Arial" font-size="14" fill="#486455">Restricciones y vínculos a actividades.</text><text x="636" y="488" font-family="Arial" font-size="14" fill="#486455">Planes, avances e interrupciones.</text><text x="636" y="508" font-family="Arial" font-size="14" fill="#486455">Componentes, fuentes, planos y marcas.</text><text x="636" y="528" font-family="Arial" font-size="14" fill="#486455">Correspondencias e historial.</text><rect x="40" y="390" width="460" height="205" rx="10" fill="#eaf2fc" stroke="#5980ae" stroke-width="1.6"/><text x="56" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T04 · Motor operativo · engine.js</text><text x="56" y="448" font-family="Arial" font-size="14" fill="#486455">Calendario y duración Q/R.</text><text x="56" y="468" font-family="Arial" font-size="14" fill="#486455">Precedencias, entregas y cuadrillas.</text><text x="56" y="488" font-family="Arial" font-size="14" fill="#486455">Preparación y pronóstico condicionado.</text><text x="56" y="508" font-family="Arial" font-size="14" fill="#486455">Compromisos, PPC, PRL y continuidad.</text><rect x="1200" y="140" width="460" height="190" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="1216" y="169" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T05 · Relación documental</text><text x="1216" y="198" font-family="Arial" font-size="14" fill="#486455">relations.js + documents.js</text><text x="1216" y="218" font-family="Arial" font-size="14" fill="#486455">Cruces de WBS, descripción y componente.</text><text x="1216" y="238" font-family="Arial" font-size="14" fill="#486455">Referencias a metrado, APU y plano.</text><text x="1216" y="258" font-family="Arial" font-size="14" fill="#486455">No reparte totales ni inventa ubicaciones.</text><text x="1216" y="278" font-family="Arial" font-size="14" fill="#486455">Un enlace documental no habilita ejecución.</text><rect x="1200" y="390" width="460" height="205" rx="10" fill="#f2edfa" stroke="#8e78b4" stroke-width="1.6"/><text x="1216" y="419" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T06 · Salidas y visores</text><text x="1216" y="448" font-family="Arial" font-size="14" fill="#486455">Resumen, Lookahead y restricciones.</text><text x="1216" y="468" font-family="Arial" font-size="14" fill="#486455">Plan semanal y registro de avance.</text><text x="1216" y="488" font-family="Arial" font-size="14" fill="#486455">Indicadores, historial y exportaciones.</text><text x="1216" y="508" font-family="Arial" font-size="14" fill="#486455">plans-ui.js: visor CAD.</text><text x="1216" y="528" font-family="Arial" font-size="14" fill="#486455">Flujo LBMS: gráfico de tiempo–ubicación.</text><rect x="40" y="740" width="460" height="175" rx="10" fill="#e5f3e9" stroke="#398267" stroke-width="1.6"/><text x="56" y="769" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T07 · Mis datos · almacenamiento local</text><text x="56" y="798" font-family="Arial" font-size="14" fill="#486455">Proyecto guardado en este navegador.</text><text x="56" y="818" font-family="Arial" font-size="14" fill="#486455">Versión anterior para recuperación.</text><text x="56" y="838" font-family="Arial" font-size="14" fill="#486455">Exportar / restaurar respaldo JSON.</text><text x="56" y="858" font-family="Arial" font-size="14" fill="#486455">Sin sincronización entre dispositivos.</text><rect x="620" y="740" width="460" height="195" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="636" y="769" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T08 · Prueba · almacenamiento separado</text><text x="636" y="798" font-family="Arial" font-size="14" fill="#486455">Prueba vacía: inicia sin registros.</text><text x="636" y="818" font-family="Arial" font-size="14" fill="#486455">Predeterminados: 8 actividades, 4 restricciones</text><text x="636" y="838" font-family="Arial" font-size="14" fill="#486455">y un plan con 2 compromisos ficticios.</text><text x="636" y="858" font-family="Arial" font-size="14" fill="#486455">Ambas opciones usan un espacio de prueba.</text><text x="636" y="878" font-family="Arial" font-size="14" fill="#486455">Mis datos recupera el proyecto anterior.</text><rect x="1200" y="740" width="460" height="195" rx="10" fill="#f2f5f4" stroke="#bdccc5" stroke-width="1.6"/><text x="1216" y="769" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T09 · Alcance de la seguridad actual</text><text x="1216" y="798" font-family="Arial" font-size="14" fill="#486455">Se verifica la estructura de los registros.</text><text x="1216" y="818" font-family="Arial" font-size="14" fill="#486455">La prueba no escribe sobre el proyecto real.</text><text x="1216" y="838" font-family="Arial" font-size="14" fill="#486455">No hay cuentas, roles autenticados ni servidor</text><text x="1216" y="858" font-family="Arial" font-size="14" fill="#486455">de evidencias; el revisor es declarado.</text><text x="1216" y="878" font-family="Arial" font-size="14" fill="#486455">Borrar datos del navegador puede perder registros.</text><rect x="40" y="1000" width="1620" height="140" rx="10" fill="#fff3da" stroke="#b38b3d" stroke-width="1.6"/><text x="56" y="1029" font-family="Arial" font-size="16" font-weight="bold" fill="#173c31">T10 · Qué significa «conectado»</text><text x="56" y="1058" font-family="Arial" font-size="14" fill="#486455">Conexión operativa: misma partida + ubicación → puede alimentar Q/R y preparación si cumple las demás reglas.</text><text x="56" y="1078" font-family="Arial" font-size="14" fill="#486455">Conexión documental: correspondencia de fuentes → sirve para consultar y revisar, aunque la ejecución siga pendiente.</text><text x="56" y="1098" font-family="Arial" font-size="14" fill="#486455">LBS y cuadrillas reales deben definirse y validarse; los documentos agregados no sustituyen esos datos.</text><text x="40" y="1200" font-family="Arial" font-size="13" fill="#60766b">Pitocuna · Estructura actual d4074f4 · Los códigos permiten solicitar cambios; no representan pantallas nuevas.</text></svg>